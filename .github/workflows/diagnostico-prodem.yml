name: Diagnosticar conexión Prodem

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prodem:
    name: Prodem desde ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Comprobar DNS, HTTPS y tasas de Prodem
        run: python -X utf8 pruebas/diagnostico_conexion_prodem.py
